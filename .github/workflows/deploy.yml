# サイトを組み立てて、公開先に送る。
#
# 3つに分けてある。
#
#   build … 型検査・検証・組み立て。**いつも動く。** ここが緑なら壊れていない
#   pages … GitHub Pages に出す。変数 PUBLISH_PAGES が true のときだけ
#   aws   … AWS に出す。変数 AWS_DEPLOY_ROLE_ARN が入っているときだけ
#
# 送り先が未設定のうちは、送る仕事は**動かさずに飛ばす**（失敗にしない）。
# 設定していないだけで毎回失敗のメールが届くと、本当に壊れた日に気づけなくなる。
#
# aws を動かすときは、先に infra/ を1度デプロイして、下の3つを
# リポジトリの Variables（Secrets ではない。秘密ではないので）に入れる。
#   AWS_DEPLOY_ROLE_ARN   … cdk deploy の出力 DeployRoleArn
#   AWS_S3_BUCKET         … 同 BucketName
#   AWS_CLOUDFRONT_ID     … 同 DistributionId
#
# アクセスキーは保存していない。OIDC で「このリポジトリの main から来た」ことを
# AWS 側が確認し、その場限りの資格情報を渡す。鍵がどこにも無いので漏れようがない。

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # ---- 組み立てと検査。送り先の設定に関係なく、いつも動く ----
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 道具を入れる
        run: npm ci

      # 壊れたものを公開しないよう、組み立てる前に必ず通す
      - name: 型を検査する
        run: npm run check

      - name: キャプション解析と英文を検証する
        run: npm test

      - name: ページを組み立てる
        run: npm run build

      # 後ろの仕事が同じものを送れるように、組み立てた dist/ を受け渡す
      - name: 組み立てたものを受け渡す
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # ---- GitHub Pages に出す（任意）----
  # 動かすには2つ要る。どちらもリポジトリの設定画面から。
  #   1. Settings → Pages → Source を「GitHub Actions」にする
  #   2. Settings → Variables に PUBLISH_PAGES = true を足す
  # Source が「Deploy from a branch」のままだとこの仕事は失敗するので、
  # 変数で明示的に有効にするまで動かさないようにしてある。
  pages:
    needs: build
    if: vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

  # ---- AWS に出す（本番）----
  aws:
    needs: build
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC のトークンを受け取るために必要
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: AWS の資格情報を受け取る
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # CSS・JS・写真を先に送る。HTML を先に送ると、
      # まだ置かれていないCSSを読みに行く瞬間ができる。
      # HTML 以外は変わる頻度が低いので、キャッシュを長めに持たせる。
      - name: CSS・JS・写真を送る
        run: aws s3 sync dist/ "s3://${{ vars.AWS_S3_BUCKET }}" --exclude "*.html" --cache-control "public,max-age=86400"

      # HTML は毎回変わるのでキャッシュを短く。
      # --delete はここだけ。消したページを S3 からも消す
      - name: HTML を送る
        run: aws s3 sync dist/ "s3://${{ vars.AWS_S3_BUCKET }}" --delete --cache-control "public,max-age=300"

      - name: キャッシュを消す
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.AWS_CLOUDFRONT_ID }}" --paths "/*"
