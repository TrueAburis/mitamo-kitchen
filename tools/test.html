<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キャプション解析のテスト</title>
<style>
  body{font-family:system-ui,"Yu Gothic UI",sans-serif;margin:0;padding:24px;background:#FCFBF8;color:#1E2320;line-height:1.7}
  h1{font-size:20px;margin:0 0 4px}
  .lead{margin:0 0 24px;color:#5C6360;font-size:13px}
  .case{border:1px solid #DCD8CF;margin:0 0 26px}
  .case h2{margin:0;padding:11px 14px;background:#24443A;color:#FCFBF8;font-size:15px}
  .body{padding:14px}
  table{border-collapse:collapse;width:100%;font-size:13px;margin:0 0 12px}
  th,td{border:1px solid #DCD8CF;padding:5px 8px;text-align:left;vertical-align:top}
  th{width:9em;font-weight:500;color:#5C6360;background:#F5F2EC}
  .null{color:#B4472E;font-family:ui-monospace,Consolas,monospace}
  .warn{margin:0;padding:9px 12px;border-left:3px solid #B4472E;background:#FBF4F2;font-size:12.5px}
  .warn div{margin:2px 0}
  .grp{margin:10px 0 0;font-size:13px}
  .grp h3{margin:0 0 4px;font-size:13px}
  .grp ul{margin:0 0 8px;padding-left:1.2em}
  .qty{font-family:ui-monospace,Consolas,monospace}
  .note{color:#B4472E}
  .pr{display:inline-block;margin-left:8px;padding:1px 7px;border:1px solid #B4472E;color:#B4472E;font-size:11px}
</style>
</head>
<body>

<h1>キャプション解析のテスト</h1>
<p class="lead">実際の投稿3本を解析した結果です。赤字は「取れなかった／気をつけるところ」。</p>

<div id="out"></div>

<script src="parse-caption.js"></script>
<script>
var FILES = [
  ['南蛮漬け（英語あり・グループあり）', 'fixtures/nanbanzuke.txt'],
  ['素麺（注意書きの混入・英語の語順が逆）', 'fixtures/somen.txt'],
  ['小籠包（英語なし・PR案件）', 'fixtures/shoronpo.txt']
];

function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
function val(v){ return v==null ? '<span class="null">null（取れなかった）</span>' : esc(v); }

function groupsHtml(groups, label){
  if(!groups.length) return '<div class="grp"><h3>'+label+'</h3><span class="null">なし</span></div>';
  var h = '<div class="grp"><h3>'+label+'</h3>';
  groups.forEach(function(g){
    if(g.name) h += '<b>☆'+esc(g.name)+'☆</b>';
    h += '<ul>';
    g.items.forEach(function(it){
      h += '<li>'+esc(it.name)+' … '+(it.qty?'<span class="qty">'+esc(it.qty)+'</span>':'<span class="null">分量なし</span>')+'</li>';
    });
    g.notes.forEach(function(n){ h += '<li class="note">注意書きとして扱った: '+esc(n)+'</li>'; });
    h += '</ul>';
  });
  return h + '</div>';
}

Promise.all(FILES.map(function(f){
  return fetch(f[1]).then(function(r){ return r.text(); }).then(function(t){ return [f[0], t]; });
})).then(function(all){
  var out = document.getElementById('out');
  all.forEach(function(pair){
    var r = CaptionParser.parse(pair[1]);
    var el = document.createElement('div');
    el.className = 'case';
    el.innerHTML =
      '<h2>'+esc(pair[0])+(r.isPR?'<span class="pr">PR案件として検出</span>':'')+'</h2>'+
      '<div class="body">'+
      '<table>'+
        '<tr><th>タイトル(日)</th><td>'+val(r.titleJa)+'</td></tr>'+
        '<tr><th>タイトル(英)</th><td>'+val(r.titleEn)+'</td></tr>'+
        '<tr><th>リード(日)</th><td>'+val(r.leadJa)+'</td></tr>'+
        '<tr><th>リード(英)</th><td>'+val(r.leadEn)+'</td></tr>'+
        '<tr><th>ハッシュタグ</th><td>'+esc(r.hashtags.join(' / '))+'</td></tr>'+
        '<tr><th>手順</th><td>'+(r.steps.length?esc(r.steps.join(' / ')):'<span class="null">なし</span>')+'</td></tr>'+
      '</table>'+
      groupsHtml(r.groupsJa, '材料（日本語）')+
      groupsHtml(r.groupsEn, '材料（英語）')+
      (r.warnings.length ? '<div class="warn">'+r.warnings.map(function(w){return '<div>・'+esc(w)+'</div>';}).join('')+'</div>' : '')+
      '</div>';
    out.appendChild(el);
  });
}).catch(function(e){
  document.getElementById('out').textContent = '読み込みに失敗: ' + e.message;
});
</script>
</body>
</html>
